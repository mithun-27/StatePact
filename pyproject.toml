[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentcommit"
dynamic = ["version"]
description = "Transaction management for autonomous AI agents: optimistic concurrency, MVCC, 2PL, leases and fencing for shared agent state."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Mithun S", email = "mithun.s.genai@gmail.com" }]
keywords = [
  "ai-agents",
  "concurrency",
  "transactions",
  "optimistic-concurrency-control",
  "mvcc",
  "distributed-systems",
  "langgraph",
  "crewai",
  "autogen",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Topic :: Database :: Database Engines/Servers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
postgres = [
    "asyncpg>=0.29,<1",
]
redis = [
    "redis>=5.0,<6",
]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]
langgraph = ["langgraph>=0.2"]
crewai = ["crewai>=0.60"]
autogen = ["autogen-agentchat>=0.4", "autogen-core>=0.4"]
demo = ["gradio>=4.44"]
bench = ["pytest-benchmark>=4.0"]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
  "pymdown-extensions>=10.8",
]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "build>=1.2",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/mithun-27/AgentCommit"
Documentation = "https://github.com/mithun-27/AgentCommit#documentation"
Repository = "https://github.com/mithun-27/AgentCommit"
Issues = "https://github.com/mithun-27/AgentCommit/issues"
Changelog = "https://github.com/mithun-27/AgentCommit/blob/main/CHANGELOG.md"

[project.scripts]
agentcommit = "agentcommit.cli:main"

[tool.hatch.version]
path = "src/agentcommit/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcommit"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/benchmarks",
  "/demo",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "postgres: requires a live PostgreSQL instance (AGENTCOMMIT_TEST_POSTGRES_URL)",
  "redis: requires a live Redis instance (AGENTCOMMIT_TEST_REDIS_URL)",
  "stress: long-running stress tests",
  "benchmark: micro benchmarks (pytest-benchmark)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:gradio.*"]

[tool.coverage.run]
source = ["agentcommit"]
branch = true
omit = ["src/agentcommit/integrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RET", "PTH", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["agentcommit"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = false
plugins = []
exclude = ["benchmarks", "demo", "docs", "examples"]

[[tool.mypy.overrides]]
module = ["agentcommit.integrations.*"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["agentcommit.observability.otel"]
ignore_missing_imports = true
