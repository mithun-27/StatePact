site_name: AgentCommit

site_description: Transaction management for autonomous AI agents.

site_url: https://mithun-27.github.io/AgentCommit/

repo_name: mithun-27/AgentCommit
repo_url: https://github.com/mithun-27/AgentCommit

edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - content.action.edit
    - content.code.annotate
    - content.code.copy
    - search.highlight
    - search.share
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts: concepts.md
  - Isolation and anomalies: isolation.md
  - Backends: backends.md
  - Leases and fencing: leases.md
  - Idempotency and side effects: idempotency.md
  - Retries: retries.md
  - Integrations: integrations.md
  - Benchmarks: benchmarks.md
  - Operations: operations.md
  - Limitations: limitations.md
  - API reference: api.md
