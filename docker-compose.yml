services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentcommit
      POSTGRES_PASSWORD: agentcommit
      POSTGRES_DB: agentcommit
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcommit -d agentcommit"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENTCOMMIT_DATABASE_URL: postgresql://agentcommit:agentcommit@postgres:5432/agentcommit
      AGENTCOMMIT_REDIS_URL: redis://redis:6379/0
      GRADIO_SERVER_NAME: 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
