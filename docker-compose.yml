name: statepact

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: statepact
      POSTGRES_PASSWORD: statepact
      POSTGRES_DB: statepact
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U statepact -d statepact"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      STATEPACT_DATABASE_URL: postgresql://statepact:statepact@postgres:5432/statepact
      STATEPACT_REDIS_URL: redis://redis:6379/0
      GRADIO_SERVER_NAME: 0.0.0.0
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
