name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.8.22"
  STATEPACT_TEST_POSTGRES_URL: "postgresql://statepact:statepact@localhost:5432/statepact"
  STATEPACT_TEST_REDIS_URL: "redis://localhost:6379/0"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra postgres --extra redis --extra otel

      - name: Ruff
        run: uv run ruff check src tests demo benchmarks

      - name: Ruff format check
        run: uv run ruff format --check src tests demo benchmarks

      - name: mypy
        run: uv run mypy src

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: statepact
          POSTGRES_PASSWORD: statepact
          POSTGRES_DB: statepact
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U statepact -d statepact"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra postgres --extra redis --extra otel

      - name: Run tests
        run: uv run --no-sync pytest -q --cov=statepact --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  demo:
    name: Demo smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev --extra demo

      - name: Import the Gradio app
        run: uv run python -c "from demo.app import build_demo; build_demo(); print('demo ok')"

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  wheel:
    name: Wheel install smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build wheel
        run: uv build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          with zipfile.ZipFile(wheel) as zf:
              names = zf.namelist()
          assert any(name.endswith("statepact/py.typed") for name in names), "py.typed missing"
          assert not [
              name for name in names if "__pycache__" in name or name.endswith(".pyc")
          ], "bytecode found in wheel"
          print(f"{wheel}: {len(names)} entries, py.typed present")
          PY

      - name: Install into a clean virtual environment
        run: |
          uv venv --python ${{ env.PYTHON_VERSION }} .venv-smoke
          uv pip install --python .venv-smoke/bin/python dist/*.whl
          .venv-smoke/bin/python - <<'PY'
          import importlib.metadata

          import statepact

          installed = importlib.metadata.version("statepact")
          assert statepact.__version__ == installed, (statepact.__version__, installed)
          print(f"statepact {installed} imported from {statepact.__file__}")
          PY
          .venv-smoke/bin/statepact --version
          .venv-smoke/bin/statepact info
          .venv-smoke/bin/statepact smoke

  docs:
    name: Docs build (strict)
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build with strict mode
        run: uv run mkdocs build --strict
